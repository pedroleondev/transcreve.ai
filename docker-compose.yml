services:
  transcreveai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transcreveai-app
    restart: unless-stopped
    ports:
      - "3000:3000"   # acesso direto (dev); o caminho "oficial" é via Traefik :443
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-transcreveai_docker_jwt_secret_secure_key_2026}
      - APP_SECRET_KEY=${APP_SECRET_KEY:-transcreveai_dev_app_secret_key_32chars_minimum_length!}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      - .:/app
      - /app/node_modules
      - ./turboscribe.sqlite:/app/turboscribe.sqlite
      - ./uploads:/app/uploads
    # Roteamento fica no Traefik via arquivo (traefik/dynamic.yml) — ver
    # comentário no serviço traefik abaixo.
    networks:
      - default

  traefik:
    image: traefik:v3.2
    container_name: transcreveai-traefik
    restart: unless-stopped
    # Reverse proxy local com HTTPS. O roteamento é ESTÁTICO (arquivo), não
    # provider docker: sem docker.sock exposto e sem depender do proxy de
    # socket do Docker Desktop. O dashboard (:8080) não tem auth — LAN de dev.
    ports:
      - "80:80"      # HTTP -> redirect 308 para HTTPS
      - "443:443"    # HTTPS (certificado local em certs/)
      - "8080:8080"  # dashboard do Traefik
    volumes:
      - ./traefik:/etc/traefik:ro
      - ./certs:/certs:ro
    depends_on:
      - transcreveai
    networks:
      - default

  # Portainer — deixado desligado até a migração de gestão de containers.
  # Para ativar: descomente, rode `docker compose up -d portainer` e acesse
  # https://192.168.1.3:9443 (é o único serviço que precisa do docker.sock).
  # portainer:
  #   image: portainer/portainer-ce:latest
  #   container_name: transcreveai-portainer
  #   restart: unless-stopped
  #   ports:
  #     - "9443:9443"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - portainer_data:/data
  #   networks:
  #     - default

networks:
  default:
    driver: bridge

