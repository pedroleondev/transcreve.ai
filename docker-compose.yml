services:
  transcreveai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transcreveai-app
    restart: unless-stopped
    ports:
      - "3000:3000"   # acesso direto (dev); o caminho "oficial" é via Traefik :443
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-transcreveai_docker_jwt_secret_secure_key_2026}
      - APP_SECRET_KEY=${APP_SECRET_KEY:-transcreveai_dev_app_secret_key_32chars_minimum_length!}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # T-08 fase 2: driver swap. sqlite (default) ou postgres (service `db`).
      # Migrar: rode o ETL (scripts/migrate-sqlite-to-postgres.js) e depois
      # DB_DRIVER=postgres no .env + `docker compose up -d transcreveai`.
      # Rollback: remover DB_DRIVER do .env e subir de volta.
      - DB_DRIVER=${DB_DRIVER:-sqlite}
      # T-28: com NODE_ENV=production (imagem) e sem SMTP, o cadastro público
      # fica fechado (503) — correto para produção. No self-host local, defina
      # REGISTRATION_REQUIRES_SMTP=false no .env: o link de confirmação vai
      # para o log do servidor até você configurar SMTP_*.
      - REGISTRATION_REQUIRES_SMTP=${REGISTRATION_REQUIRES_SMTP:-true}
      # T-11: baixar de hosts privados/LAN (anti-SSRF ligado por padrao em
      # producao). No self-host local, true permite baixar de 192.168.x.x etc.
      - ALLOW_PRIVATE_DOWNLOADS=${ALLOW_PRIVATE_DOWNLOADS:-false}
      # T-27: cobrança recorrente via Asaas. Sem ASAAS_API_KEY a plataforma roda
      # normal, mas os botões de assinatura ficam "Em breve". Em produção sem
      # ASAAS_WEBHOOK_TOKEN o app recusa subir — no self-host local defina
      # BILLING_STRICT=false para desenvolver sem o Asaas configurado.
      - ASAAS_API_KEY=${ASAAS_API_KEY:-}
      - ASAAS_API_URL=${ASAAS_API_URL:-https://sandbox.asaas.com/api/v3}
      - ASAAS_WEBHOOK_TOKEN=${ASAAS_WEBHOOK_TOKEN:-}
      - BILLING_STRICT=${BILLING_STRICT:-true}
      - DATABASE_URL=${DATABASE_URL}
      - PGHOST=${PGHOST:-db}
      - PGPORT=${PGPORT:-5432}
      - PGUSER=${PGUSER:-transcreveai}
      - PGPASSWORD=${PGPASSWORD:-transcreveai_local_dev}
      - PGDATABASE=${PGDATABASE:-transcreveai}
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    # Roteamento fica no Traefik via arquivo (traefik/dynamic.yml) — ver
    # comentário no serviço traefik abaixo.
    networks:
      - default

  # T-08: PostgreSQL — banco-alvo da migração (fase 1: ETL validado; o app ainda
  # roda em SQLite até a fase 2 do driver swap). Volume nomeado: no Linux/KVM2
  # o WAL do Postgres é seguro, diferente do bind-mount Windows que corrompia
  # o SQLite. Em dev local, o serviço sobe junto e fica disponível p/ testes.
  db:
    image: postgres:16-alpine
    container_name: transcreveai-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-transcreveai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-transcreveai_local_dev}
      - POSTGRES_DB=${POSTGRES_DB:-transcreveai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback apenas: ferramentas locais (suíte de testes, DBeaver) enxergam
      # o mesmo banco do app sem depender de docker exec. Não expõe na rede.
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  traefik:
    image: traefik:v3.2
    container_name: transcreveai-traefik
    restart: unless-stopped
    # Reverse proxy local com HTTPS. O roteamento é ESTÁTICO (arquivo), não
    # provider docker: sem docker.sock exposto e sem depender do proxy de
    # socket do Docker Desktop. O dashboard (:8080) não tem auth — LAN de dev.
    ports:
      - "80:80"      # HTTP -> redirect 308 para HTTPS
      - "443:443"    # HTTPS (certificado local em certs/)
      - "8088:8080"  # dashboard do Traefik (8080 fica com o ma-manager)
    volumes:
      - ./traefik:/etc/traefik:ro
      - ./certs:/certs:ro
    depends_on:
      - transcreveai
    networks:
      - default

  # Portainer — deixado desligado até a migração de gestão de containers.
  # Para ativar: descomente, rode `docker compose up -d portainer` e acesse
  # https://192.168.1.3:9443 (é o único serviço que precisa do docker.sock).
  # portainer:
  #   image: portainer/portainer-ce:latest
  #   container_name: transcreveai-portainer
  #   restart: unless-stopped
  #   ports:
  #     - "9443:9443"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - portainer_data:/data
  #   networks:
  #     - default

networks:
  default:
    driver: bridge

volumes:
  pgdata:
  # portainer_data:
