services:
  transcreveai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transcreveai-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-transcreveai_docker_jwt_secret_secure_key_2026}
      - APP_SECRET_KEY=${APP_SECRET_KEY:-transcreveai_dev_app_secret_key_32chars_minimum_length!}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      - .:/app
      - /app/node_modules
      - ./turboscribe.sqlite:/app/turboscribe.sqlite
      - ./uploads:/app/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.transcreveai.rule=Host(`transcreveai.localhost`) || Host(`transcreveai.local`)"
      - "traefik.http.routers.transcreveai.entrypoints=web"
      - "traefik.http.services.transcreveai.loadbalancer.server.port=3000"
    networks:
      - default

networks:
  default:
    driver: bridge
