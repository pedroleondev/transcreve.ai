# ============================================================================
# Falou.ai - Stack de producao para Portainer (KVM2 / PegazusNet)
# Modelo: swarm + Traefik externo (labels) + Let's Encrypt.
# Subir via Portainer -> Stacks -> Add stack, colar este arquivo e
# preencher as env vars no editor de variaveis do Portainer.
#
# PRE-REQUISITOS (uma vez, no terminal do manager):
#   docker volume create falou_uploads
#   docker volume create falou_pgdata
#   (A rede PegazusNet ja existe no seu caso)
#
# VARIAVEIS OBRIGATORIAS no Portainer:
#   FALOU_DOMAIN        ex: falou.pegazus.tech
#   JWT_SECRET          node -e "crypto.randomBytes(48).toString('hex')"
#   APP_SECRET_KEY      node -e "crypto.randomBytes(48).toString('hex')"  (GUARDE)
#   ADMIN_EMAIL         seu e-mail de admin
#   ADMIN_PASSWORD      minimo 8 chars
#   OPENROUTER_API_KEY  chave OpenRouter (sk-or-v1-...)
#   FALOU_DB_PASSWORD   senha forte para o Postgres interno
#   ASAAS_API_KEY       chave Asaas de producao
#   ASAAS_WEBHOOK_TOKEN token gerado por voce (mesmo no painel Asaas)
#   GHCR_USER           seu usuario GitHub (ex: pedroleondev)
#   GHCR_TOKEN          PAT GitHub com permissao read:packages
#
# AUTO-ATUALIZACAO (substitui o Stack Webhook Business do Portainer):
#   O Watchtower verifica o GHCR a cada 5 minutos e recria o falou_app
#   automaticamente quando uma nova imagem :latest e publicada.
#   Fluxo: git push main -> GitHub Actions -> GHCR -> Watchtower -> deploy
# ============================================================================
version: "3.8"

services:

  ## ----------------------- FALOU.APP ----------------------- ##

  falou_app:
    image: ghcr.io/pedroleondev/falou-ai:latest
    volumes:
      - falou_uploads:/app/uploads
    networks:
      - PegazusNet
    environment:
      - PUBLIC_BASE_URL=https://${FALOU_DOMAIN}
      - JWT_SECRET=${JWT_SECRET}
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DB_DRIVER=postgres
      - DATABASE_URL=postgres://falou:${FALOU_DB_PASSWORD}@falou_db:5432/falou
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ASAAS_API_KEY=${ASAAS_API_KEY}
      - ASAAS_API_URL=${ASAAS_API_URL:-https://www.asaas.com/api/v3}
      - ASAAS_WEBHOOK_TOKEN=${ASAAS_WEBHOOK_TOKEN}
      - BILLING_STRICT=true
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - REGISTRATION_REQUIRES_SMTP=${REGISTRATION_REQUIRES_SMTP:-true}
      - ALLOW_PRIVATE_DOWNLOADS=false
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "2"
          memory: 2048M
      labels:
        - traefik.enable=true
        - "traefik.http.routers.falou_app.rule=Host(`${FALOU_DOMAIN}`)"
        - traefik.http.routers.falou_app.entrypoints=websecure
        - traefik.http.services.falou_app.loadbalancer.server.port=3000
        - traefik.http.routers.falou_app.service=falou_app
        - traefik.http.routers.falou_app.tls.certresolver=letsencryptresolver
        - com.centurylinklabs.watchtower.enable=true

  ## ----------------------- FALOU.DB ----------------------- ##

  falou_db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=falou
      - POSTGRES_PASSWORD=${FALOU_DB_PASSWORD}
      - POSTGRES_DB=falou
    volumes:
      - falou_pgdata:/var/lib/postgresql/data
    networks:
      - PegazusNet
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M

  ## ----------------------- WATCHTOWER ----------------------- ##
  ## Substitui o Stack Webhook (Business Feature) do Portainer.
  ## Verifica o GHCR a cada 5 minutos e recria falou_app quando
  ## uma nova imagem :latest e publicada pelo GitHub Actions.
  ## So atualiza containers com label watchtower.enable=true.

  watchtower:
    image: containrrr/watchtower:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_LABEL_ENABLE=true
      - REPO_USER=${GHCR_USER}
      - REPO_PASS=${GHCR_TOKEN}
    networks:
      - PegazusNet
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      labels:
        - com.centurylinklabs.watchtower.enable=false

## ----------------------- VOLUMES E REDES ----------------------- ##

volumes:
  falou_uploads:
    external: true
    name: falou_uploads
  falou_pgdata:
    external: true
    name: falou_pgdata

networks:
  PegazusNet:
    name: PegazusNet
    external: true
