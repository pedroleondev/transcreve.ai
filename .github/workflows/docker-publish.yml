# T-32: build e push da imagem de producao para o GitHub Container Registry
# (ghcr.io) — privado por padrao, so o dono do repo (e quem ele liberar) puxa.
#
# Disparo: push na main (tag :latest + :sha) e tags v* (semver).
# Autenticacao: AUTOMATICA via GITHUB_TOKEN (o proprio GitHub entrega) —
# zero conta externa, zero secret manual.
# Imagem final: ghcr.io/pedroleondev/falou-ai:latest
#
# Para o Portainer puxar a imagem PRIVADA (uma vez, no Portainer):
#   1. GitHub -> Settings -> Developer settings -> Personal access tokens ->
#      Tokens (classic) -> gere um token so com a permissao "read:packages".
#   2. Portainer -> Registries -> Add registry -> Custom:
#      Name: ghcr · Registry URL: ghcr.io · Username: pedroleondev · Password: o token.
name: docker-publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/pedroleondev/falou-ai

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR (automatico)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags e labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
