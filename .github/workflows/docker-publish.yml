# T-32: build e push da imagem de producao para o Docker Hub.
#
# Disparo: push na main (tag :latest + :sha) e tags v* (semver).
# Pre-requisitos (uma vez, no GitHub -> Settings -> Secrets -> Actions):
#   DOCKERHUB_USERNAME  = seu usuario do Docker Hub (ex: pedroleondev)
#   DOCKERHUB_TOKEN     = Access Token do Docker Hub (hub.docker.com -> Account Settings -> Security)
# Repo alvo: pedroleondev/falou-ai  (crie "falou-ai" como PUBLIC no Docker Hub).
name: docker-publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: pedroleondev/falou-ai

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags e labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
